---
- name: Uninstall OTA demo
  hosts: localhost
  connection: local
  tasks:
    - name: 1. 更新ツールの自動実行を解除する Remove daily OTA update cron job
      ansible.builtin.cron:
        name: "Daily OTA update"
        state: absent
    - name: 2. 許可したsudo設定を削除する Remove OTA sudoers configuration
      ansible.builtin.file:
        path: /etc/sudoers.d/ota-demo
        state: absent
      become: true
    - name: 3. インストールしたソフトを削除 Remove OTA demo directory and files
      ansible.builtin.file:
        path: /opt/ota-demo
        state: absent
      become: true
    - name: 4. ログファイルを削除する Remove log files directory and files
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/ota-log"
        state: absent
    ###########################################################################
    ## Ansible 本体の削除について
    ## ・以下(シーケンスname: 5.)は誤操作防止のためコメントアウトしてあります。
    ## ・使用したい場合は「# 」を消してください。sed "s/#\ //" で削除できます。
    ## ・Ansible本体の削除につき、削除後の継続が出来ずエラー停止します。
