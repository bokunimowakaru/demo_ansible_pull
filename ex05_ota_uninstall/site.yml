---
- name: Uninstall OTA demo
  hosts: localhost
  connection: local
  tasks:
    - name: 1. 更新ソフトの自動実行を解除する Remove daily OTA update cron job
      ansible.builtin.cron:
        name: "Daily OTA update"
        state: absent
    - name: 2. インストールしたソフトを削除 Remove OTA demo directory and files
      ansible.builtin.file:
        path: /opt/ota-demo
        state: absent
      become: true
    - name: 3. ログファイルを削除する Remove log files directory and files
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/ota-log"
        state: absent
...
