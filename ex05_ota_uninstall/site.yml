---
- name: Uninstall OTA demo
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Pre 0. 実行ユーザー名を取得する Read the original execution user
      ansible.builtin.set_fact:
        ota_user: "{{ ansible_user_id }}"
  tasks:
    - name: 1. 更新ソフトの自動実行を解除する Remove daily OTA update cron job
      ansible.builtin.cron:
        name: "Daily OTA update"
        state: absent
    - name: 2. 許可したsudo設定を削除する Remove OTA sudoers configuration
      ansible.builtin.file:
        path: /etc/sudoers.d/ota-demo
        state: absent
      become: true
    - name: 3. インストールしたソフトを削除 Remove OTA demo directory and files
      ansible.builtin.file:
        path: /opt/ota-demo
        state: absent
      become: true
    - name: 4. ログファイルを削除する Remove log files directory and files
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/ota-log"
        state: absent
...
