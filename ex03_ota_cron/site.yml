---
- name: Schedule daily OTA update
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Pre 0. 実行ユーザー名を取得する Read the original execution user
      ansible.builtin.set_fact:
        ota_user: "{{ ansible_user_id }}"
  tasks:
    - name: 1. インストール用フォルダを作成する Create application directory
      ansible.builtin.file:
        path: /opt/ota-demo
        state: directory
        mode: '0755'
      become: true
    - name: 2. ログ記録用フォルダを作成する Create log files directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/ota-log"
        state: directory
        mode: '0755'
    - name: 3. ログファイルを作成する Create or update log file
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/ota-log/demo_ansible.log"
        state: touch
        mode: '0644'
    - name: 4. ソフト「hello-ota.sh」を更新する Update application
      ansible.builtin.copy:
        src: files/hello-ota.sh
        dest: /opt/ota-demo/hello-ota.sh
        mode: '0755'
      become: true
    - name: 5. ソフト「hello-ota.sh」を実行する Run application
      ansible.builtin.command:
        cmd: /opt/ota-demo/hello-ota.sh
    - name: 6. 更新ソフト「update.sh」をインストールする Install Updater
      ansible.builtin.copy:
        src: files/update.sh
        dest: /opt/ota-demo/update.sh
        mode: '0755'
      become: true
    - name: 7. 更新ソフトにパスワードなしsudo許可を設定 Password-less sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ota-demo
        owner: root
        group: root
        mode: '0440'
        content: |
          {{ ota_user }} ALL=(root) NOPASSWD: /opt/ota-demo/update.sh
        validate: '/usr/sbin/visudo -cf %s'
      become: true
    - name: 8. 更新ソフトの自動実行AM3時を設定する Schedule daily OTA update
      ansible.builtin.cron:
        name: "Daily OTA update"
        minute: "0"
        hour: "3"
        job: "/usr/bin/sudo -n /opt/ota-demo/update.sh {{ ansible_env.HOME }}/ota-log/demo_ansible.log"
...
